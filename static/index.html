<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>StitchVim – Config Generator</title>
        <!-- Bootstrap 5 + tema scuro -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-dark-5@1.1.3/dist/css/bootstrap-dark.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="bg-dark text-light">
        <div class="container py-4">
            <header
                class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary"
            >
                <h1 class="h2 mb-0">
                    🧵 StitchVim
                    <small class="text-secondary fs-6">Config Generator</small>
                    <span class="badge bg-success ms-2">v0.0.2</span>
                </h1>
                <span class="badge bg-info text-dark">⚡ 100% client‑side</span>
            </header>

            <!-- Pannello parametri -->
            <div class="card bg-dark border-secondary mb-4">
                <div class="card-body row g-3 align-items-end">
                    <div class="col-md-3">
                        <label
                            for="pkgManager"
                            class="form-label small text-uppercase text-secondary"
                            >Package Manager</label
                        >
                        <select
                            id="pkgManager"
                            class="form-select bg-dark text-light border-secondary"
                        >
                            <option value="lazy">Lazy.nvim</option>
                            <option value="minimal">Minimal</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-auto d-flex flex-wrap gap-3">
                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="chkNoComments"
                            />
                            <label class="form-check-label" for="chkNoComments"
                                >No Comments</label
                            >
                        </div>
                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="chkArchive"
                                checked
                            />
                            <label class="form-check-label" for="chkArchive"
                                >Generate ZIP</label
                            >
                        </div>
                    </div>
                    <div class="col-md-auto ms-auto">
                        <button class="btn btn-success" id="generateBtn">
                            🚀 Genera
                        </button>
                    </div>
                </div>
            </div>

            <!-- Messaggi di stato -->
            <div id="statusMessage" class="alert d-none" role="alert"></div>

            <!-- Area di anteprima -->
            <div class="card bg-dark border-secondary mb-4">
                <div class="row g-0">
                    <div
                        class="col-md-3 border-end border-secondary"
                        style="max-height: 500px; overflow-y: auto"
                    >
                        <div
                            id="fileList"
                            class="list-group list-group-flush bg-dark"
                        >
                            <div
                                class="list-group-item bg-dark text-secondary text-center"
                            >
                                Nessun file generato
                            </div>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <div
                            id="fileContent"
                            class="p-3"
                            style="
                                min-height: 400px;
                                max-height: 500px;
                                overflow-y: auto;
                            "
                        >
                            <div class="text-secondary text-center py-5">
                                Seleziona un file dalla lista
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pulsanti azioni -->
            <div class="d-flex justify-content-end gap-2">
                <button
                    class="btn btn-outline-light"
                    id="downloadZipBtn"
                    disabled
                >
                    📦 Scarica ZIP
                </button>
            </div>
        </div>

        <!-- Librerie -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
