<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StitchVim – Config Generator</title>

    <!-- Favicon -->
    <link rel="icon" href="icons/stitchfav.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="icons/stitchfav.ico" type="image/x-icon" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <img src="icons/stitchnormal.png" alt="StitchVim Logo" class="logo-img" />
                <h1>StitchVim</h1>
                <span class="subtitle">Config Generator</span>
                <span class="version-badge" id="versionBadge">v?</span>
            </div>
            <span class="badge">⚡ 100% client‑side</span>
        </header>

        <!-- Controls -->
        <section class="controls">
            <!-- Linguaggio -->
            <div class="control-group">
                <label>Linguaggio</label>
                <div class="custom-select" id="langSelect">
                    <div class="select-trigger">
                        <span class="select-value">LuaScript</span>
                        <span class="select-arrow">▼</span>
                    </div>
                    <div class="select-options">
                        <div class="select-option selected" data-value="lua">LuaScript</div>
                        <div class="select-option" data-value="vim9">Vimscript9</div>
                    </div>
                    <input type="hidden" id="langHidden" value="lua" />
                </div>
            </div>

            <!-- Package Manager -->
            <div class="control-group">
                <label>Package Manager</label>
                <div class="custom-select" id="pkgManager">
                    <div class="select-trigger">
                        <span class="select-value">Lazy.nvim</span>
                        <span class="select-arrow">▼</span>
                    </div>
                    <div class="select-options">
                        <div class="select-option selected" data-value="lazy">Lazy.nvim</div>
                        <div class="select-option" data-value="minimal">Minimal</div>
                        <div class="select-option" data-value="other">Other</div>
                    </div>
                    <input type="hidden" id="pkgManagerHidden" value="lazy" />
                </div>
            </div>

            <!-- Checkboxes -->
            <div class="control-group checkboxes">
                <label class="checkbox-label">
                    <input type="checkbox" id="chkNoComments" />
                    <span class="checkmark"></span>
                    No Comments
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chkArchive" checked />
                    <span class="checkmark"></span>
                    Generate ZIP
                </label>
                <label class="checkbox-label" id="lazyVimExtraLabel" title="Disponibile solo con LuaScript e Lazy.nvim">
                    <input type="checkbox" id="chkLazyVimExtra" />
                    <span class="checkmark"></span>
                    LazyVim Extra
                </label>
            </div>

            <button class="btn-generate" id="generateBtn">🚀 Genera</button>
        </section>

        <!-- Status -->
        <div id="statusMessage" class="status-message" role="alert"></div>

        <!-- Preview -->
        <section class="preview" id="previewContainer">
            <div class="file-list" id="fileList">
                <div class="empty-state">Nessun file generato</div>
            </div>
            <div class="file-content" id="fileContent">
                <div class="empty-state">Seleziona un file dalla lista</div>
            </div>
        </section>

        <!-- Actions -->
        <div class="actions">
            <button class="btn-reset" id="resetBtn" disabled>🔄 Reset</button>
            <button class="btn-download" id="downloadZipBtn" disabled>📦 Scarica ZIP</button>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
