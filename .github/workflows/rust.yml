name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Windows)
        run: choco install jq -y

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Get version from Cargo.toml
        id: cargo
        shell: bash
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          NAME=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Check tag matches version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.cargo.outputs.version }}" ]; then
            echo "❌ Tag v$TAG != Cargo.toml ${{ steps.cargo.outputs.version }}"
            exit 1
          fi
          echo "✅ Tag matches version"

      - name: Build release binary
        run: cargo build --release

      - name: Package (Windows)
        run: |
          mkdir dist
          copy target\release\${{ steps.cargo.outputs.name }}.exe dist\${{ steps.cargo.outputs.name }}.exe
          powershell -Command "Compress-Archive -Path dist\* -DestinationPath ${{ steps.cargo.outputs.name }}-${{ steps.cargo.outputs.version }}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.cargo.outputs.version }}
          files: ${{ steps.cargo.outputs.name }}-${{ steps.cargo.outputs.version }}.zip
