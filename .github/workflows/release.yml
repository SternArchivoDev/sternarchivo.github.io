name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install MinGW (Windows only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Extract version
        id: version
        run: |
          # Da tag: v1.2.3 → 1.2.3
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Da Cargo.toml
            VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Binary version: $VERSION"

      - name: Get package name
        id: package
        run: |
          NAME=$(grep '^name' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Prepare package
        run: |
          mkdir -p package
          BIN_NAME="${{ steps.package.outputs.name }}"
          
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" package/
          else
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" package/
          fi
          
          # Metadata file
          cat > package/BUILD_INFO.txt << EOF
          Application: $BIN_NAME
          Version: ${{ steps.version.outputs.version }}
          Target: ${{ matrix.target }}
          Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Commit: $(git rev-parse --short HEAD)
          EOF
          
          # Docs (se esistono)
          [ -f README.md ] && cp README.md package/
          [ -f LICENSE ] && cp LICENSE package/

      - name: Create archive
        run: |
          cd package
          tar -czf "../${{ steps.package.outputs.name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" *
          cd ..
          ls -lh "${{ steps.package.outputs.name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: ${{ steps.package.outputs.name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
          retention-days: 5

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.name }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
